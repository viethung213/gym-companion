version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: internal/gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-connect-go
    out: internal/gen/go
    opt:
      - paths=source_relative

  - local: protoc-gen-openapiv2
    out: docs/swagger
    strategy: all
    opt:
      - json_names_for_fields=true
      - logtostderr=true
      - allow_merge=true
      - merge_file_name=unified_api
      - output_format=yaml
      - use_allof_for_refs=true
