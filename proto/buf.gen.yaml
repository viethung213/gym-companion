version: v2
plugins:
  # Plugin Go Stubs
  - local: protoc-gen-go
    out: internal/gen/go
    opt:
      - paths=source_relative

  # Plugin Go gRPC
  - local: protoc-gen-go-grpc
    out: internal/gen/go
    opt:
      - paths=source_relative

  # Plugin Go ConnectRPC
  - local: protoc-gen-connect-go
    out: internal/gen/go
    opt:
      - paths=source_relative

  # Plugin TypeScript ECMAScript Protobuf Messages (for FE)
  - local: protoc-gen-es
    out: internal/gen/es
    opt:
      - target=ts

  # Plugin TypeScript ConnectRPC Client/Services (for FE)
  - local: protoc-gen-connect-es
    out: internal/gen/es
    opt:
      - target=ts

  # Plugin OpenAPI v2 for Swagger docs
  - local: protoc-gen-openapiv2
    out: docs/swagger
    strategy: all
    opt:
      - json_names_for_fields=true
      - logtostderr=true
      - allow_merge=true
      - merge_file_name=unified_api
      - output_format=yaml
      - use_allof_for_refs=true





