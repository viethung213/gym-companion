syntax = "proto3";

package contracts.supporting.profile.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/profile/v1/message;profilev1message";

import "contracts/supporting/exercise/v1/message/taxonomy.proto";

// InjuryInput reports pain by joint region (required). muscle is optional;
// side UNSPECIFIED means BOTH.
message InjuryInput {
  reserved 1, 2;
  reserved "muscle_group";

  string notes = 3;
  contracts.supporting.exercise.v1.message.JointRegion region = 4;
  contracts.supporting.exercise.v1.message.MuscleGroup muscle = 5;
  contracts.supporting.exercise.v1.message.BodySide side = 6;
  contracts.supporting.exercise.v1.message.InjurySeverity severity = 7;
}

message Injury {
  reserved 2, 3;
  reserved "muscle_group";

  string injury_id = 1;
  string notes = 4;
  string reported_at = 5;
  bool is_recovered = 6;
  string recovered_at = 7;
  contracts.supporting.exercise.v1.message.JointRegion region = 8;
  contracts.supporting.exercise.v1.message.MuscleGroup muscle = 9;
  contracts.supporting.exercise.v1.message.BodySide side = 10;
  contracts.supporting.exercise.v1.message.InjurySeverity severity = 11;
}

message PeriodicMetric {
  string id = 1;
  float weight_kg = 2;
  float body_fat_percent = 3;
  string progress_photo_url = 4;
  string logged_at = 5;
  float height_cm = 6;
}

message SaveHealthProfileRequest {
  reserved 9, 10;

  float weight_kg = 1;
  float height_cm = 2;
  string date_of_birth = 3; // "YYYY-MM-DD" e.g. "1998-05-15"
  string gender = 4;
  repeated string goals = 5;
  repeated InjuryInput injuries = 6;
  string experience_level = 7; // "BEGINNER", "INTERMEDIATE", "ADVANCED"
  repeated string preferred_workout_times = 8;
  string coach_style = 11;
  float target_weight_kg = 12;
  float target_body_fat_percent = 13;
  float body_fat_percent = 14;
  repeated contracts.supporting.exercise.v1.message.Equipment available_equipment = 15;
  repeated contracts.supporting.exercise.v1.message.MuscleGroup preferred_muscle_groups = 16;
  string timezone = 17; // IANA name from the browser, e.g. "Asia/Ho_Chi_Minh"; empty = UTC
}

message SaveHealthProfileResponse {
  string user_id = 1;
  float completion_rate = 2;
  bool ai_coach_activated = 3;
  string message = 4;
}

message GetProfileRequest {
  string user_id = 1; // Option for Admin/others to query user profile; if empty, uses context user_id
}

message GetProfileResponse {
  reserved 13, 14;

  string user_id = 1;
  float weight_kg = 2;
  float height_cm = 3;
  string date_of_birth = 4;
  int32 age = 5;
  string gender = 6;
  repeated string goals = 7;
  string experience_level = 8;
  repeated string preferred_workout_times = 9;
  repeated Injury injuries = 10;
  string created_at = 11;
  string updated_at = 12;
  string coach_style = 15;
  float target_weight_kg = 16;
  float target_body_fat_percent = 17;
  float completion_rate = 18;
  float body_fat_percent = 19;
  string full_name = 20;
  string avatar_url = 21;
  repeated contracts.supporting.exercise.v1.message.Equipment available_equipment = 22;
  repeated contracts.supporting.exercise.v1.message.MuscleGroup preferred_muscle_groups = 23;
  string timezone = 24; // IANA name; slot times and scheduled dates are wall clock in this zone
}

message UpdateProfileRequest {
  reserved 8, 9;

  float weight_kg = 1;
  float height_cm = 2;
  string date_of_birth = 3; // "YYYY-MM-DD" e.g. "1998-05-15"
  string gender = 4;
  repeated string goals = 5;
  string experience_level = 6;
  repeated string preferred_workout_times = 7;
  string coach_style = 10;
  float target_weight_kg = 11;
  float target_body_fat_percent = 12;
  float body_fat_percent = 13;
  repeated contracts.supporting.exercise.v1.message.Equipment available_equipment = 14;
  repeated contracts.supporting.exercise.v1.message.MuscleGroup preferred_muscle_groups = 15;
  string timezone = 16; // IANA name; empty keeps the stored zone
}

message UpdateProfileResponse {
  bool success = 1;
  string message = 2;
}

message LogPeriodicMetricsRequest {
  float weight_kg = 1;
  float body_fat_percent = 2;
  string progress_photo_url = 3;
  float height_cm = 4;
}

message LogPeriodicMetricsResponse {
  string log_id = 1;
  string user_id = 2;
  float weight_kg = 3;
  float body_fat_percent = 4;
  string sync_status = 5;
  string message = 6;
  float height_cm = 7;
}

message GetBodyMetricsHistoryRequest {
  string user_id = 1; // Option for Admin/others to query history; if empty, uses context user_id
}

message GetBodyMetricsHistoryResponse {
  string user_id = 1;
  repeated PeriodicMetric metrics = 2;
}

// ReportInjuryRequest reports pain by joint region (required). muscle is
// optional; side UNSPECIFIED means BOTH.
message ReportInjuryRequest {
  reserved 1, 2;
  reserved "muscle_group";

  string notes = 3;
  contracts.supporting.exercise.v1.message.JointRegion region = 4;
  contracts.supporting.exercise.v1.message.MuscleGroup muscle = 5;
  contracts.supporting.exercise.v1.message.BodySide side = 6;
  contracts.supporting.exercise.v1.message.InjurySeverity severity = 7;
}

message ReportInjuryResponse {
  string injury_id = 1;
  bool success = 2;
  string message = 3;
}

message RecoverInjuryRequest {
  string injury_id = 1;
}

message RecoverInjuryResponse {
  bool success = 1;
  string message = 2;
}

message GetInjuryHistoryRequest {
  string user_id = 1; // Option for Admin/others to query history; if empty, uses context user_id
}

message GetInjuryHistoryResponse {
  string user_id = 1;
  repeated Injury injuries = 2;
}

message UpdateIdentityRequest {
  optional string full_name = 1;
  optional string avatar_url = 2;
}

message UpdateIdentityResponse {
  string user_id = 1;
  string full_name = 2;
  string avatar_url = 3;
  string message = 4;
}
