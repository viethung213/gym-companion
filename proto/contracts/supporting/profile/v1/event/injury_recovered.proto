syntax = "proto3";

package contracts.supporting.profile.v1.event;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/profile/v1/event;profilev1event";

import "google/protobuf/timestamp.proto";
import "contracts/supporting/exercise/v1/message/taxonomy.proto";

message InjuryRecoveredData {
  reserved 3;
  reserved "muscle_group";

  string user_id = 1;
  string injury_id = 2;
  google.protobuf.Timestamp recovered_at = 4;
  contracts.supporting.exercise.v1.message.JointRegion region = 5;
  contracts.supporting.exercise.v1.message.MuscleGroup muscle = 6;
}
