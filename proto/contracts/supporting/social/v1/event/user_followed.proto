syntax = "proto3";

package contracts.supporting.social.v1.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/social/v1/event;socialv1event";

message UserFollowed {
  string follower_id = 1;
  string following_id = 2;
  string follower_name = 3;
  string follower_avatar_url = 4;
  google.protobuf.Timestamp followed_at = 5;
}
