syntax = "proto3";

package contracts.supporting.social.v1.message;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/social/v1/message;socialv1message";

// --- Enums ---

enum ReactionType {
  REACTION_TYPE_UNSPECIFIED = 0;
  REACTION_TYPE_LIKE = 1;
  REACTION_TYPE_FIRE = 2;
  REACTION_TYPE_MUSCLE = 3;
  REACTION_TYPE_CLAP = 4;
}

enum FeedItemType {
  FEED_ITEM_TYPE_UNSPECIFIED = 0;
  FEED_ITEM_TYPE_POST = 1;
  FEED_ITEM_TYPE_WORKOUT_ACTIVITY = 2;
}

// --- Follow & Social Graph Messages ---

message FollowUserRequest {
  string following_id = 1; // User ID của người muốn theo dõi
}

message FollowUserResponse {
  bool success = 1;
  string message = 2;
}

message UnfollowUserRequest {
  string following_id = 1; // User ID của người muốn hủy theo dõi
}

message UnfollowUserResponse {
  bool success = 1;
  string message = 2;
}

message UserSocialSummary {
  string user_id = 1;
  string full_name = 2;
  string avatar_url = 3;
  bool is_following = 4;
}

message GetFollowersRequest {
  string user_id = 1; // Bỏ trống nếu gọi cho bản thân (/me/followers)
  int32 page_size = 2;
  string cursor = 3;
}

message GetFollowersResponse {
  repeated UserSocialSummary followers = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message GetFollowingRequest {
  string user_id = 1; // Bỏ trống nếu gọi cho bản thân (/me/following)
  int32 page_size = 2;
  string cursor = 3;
}

message GetFollowingResponse {
  repeated UserSocialSummary following = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message GetSocialSummaryRequest {
  string user_id = 1; // Bỏ trống nếu gọi cho bản thân (/me/summary)
}

message GetSocialSummaryResponse {
  string user_id = 1;
  int32 follower_count = 2;
  int32 following_count = 3;
  int32 post_count = 4;
  bool is_following = 5;
}

// --- Unified Feed Item Messages ---

message WorkoutMetricsSummary {
  string session_id = 1;
  string workout_title = 2;
  int32 duration_seconds = 3;
  float total_volume_kg = 4;
  int32 exercise_count = 5;
  int32 total_sets = 6;
}

message FeedItem {
  string id = 1;
  string user_id = 2;
  string author_name = 3;
  string author_avatar_url = 4;
  FeedItemType item_type = 5;
  string caption = 6;
  repeated string media_urls = 7;
  string visibility = 8;
  int32 reaction_count = 9;
  int32 comment_count = 10;
  string user_reaction = 11; // Reaction của người đang xem ("" nếu chưa react)
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional WorkoutMetricsSummary workout_data = 14; // Có giá trị khi item_type = WORKOUT_ACTIVITY
}

message CreatePostRequest {
  string caption = 1;
  repeated string media_urls = 2;
  string visibility = 3; // "PUBLIC", "FOLLOWERS_ONLY", "PRIVATE"
}

message CreatePostResponse {
  FeedItem item = 1;
}

message DeleteFeedItemRequest {
  string feed_item_id = 1;
}

message DeleteFeedItemResponse {
  bool success = 1;
}

message GetActivityFeedRequest {
  int32 page_size = 1;
  string cursor = 2;
}

message GetActivityFeedResponse {
  repeated FeedItem items = 1;
  string next_cursor = 2;
}

message GetUserProfileFeedRequest {
  string user_id = 1; // Bỏ trống nếu gọi cho bản thân (/me/feed)
  int32 page_size = 2;
  string cursor = 3;
}

message GetUserProfileFeedResponse {
  repeated FeedItem items = 1;
  string next_cursor = 2;
}

// --- Reaction Messages ---

message ReactTargetRequest {
  string feed_item_id = 1;
  ReactionType reaction_type = 2;
}

message ReactTargetResponse {
  bool success = 1;
  string current_reaction = 2; // Rỗng nếu vừa toggle hủy
  int32 reaction_count = 3;
}

message ReactionItem {
  string user_id = 1;
  string author_name = 2;
  string author_avatar_url = 3;
  ReactionType reaction_type = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListReactionsRequest {
  string feed_item_id = 1;
}

message ListReactionsResponse {
  repeated ReactionItem reactions = 1;
  int32 total_count = 2;
}

// --- Comment Messages ---

message CommentItem {
  string id = 1;
  string user_id = 2;
  string author_name = 3;
  string author_avatar_url = 4;
  string feed_item_id = 5;
  optional string parent_id = 6;
  string content = 7;
  google.protobuf.Timestamp created_at = 8;
}

message AddCommentRequest {
  string feed_item_id = 1;
  string content = 2;
  optional string parent_id = 3;
}

message AddCommentResponse {
  CommentItem comment = 1;
}

message ListCommentsRequest {
  string feed_item_id = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message ListCommentsResponse {
  repeated CommentItem comments = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {
  bool success = 1;
}

// --- Search & Discovery ---

message SearchUsersRequest {
  // Từ khóa tìm kiếm theo họ tên
  string query = 1;
  // Lọc theo vai trò: "user", "brand" (để trống để lấy cả hai; KHÔNG hỗ trợ "admin")
  string role = 2;
  int32 page_size = 3;
  string cursor = 4;
}

message DiscoverUserItem {
  string user_id = 1;
  string full_name = 2;
  string avatar_url = 3;
  string role = 4;
  bool is_following = 5;
  int32 follower_count = 6;
}

message SearchUsersResponse {
  repeated DiscoverUserItem users = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

