syntax = "proto3";

package contracts.supporting.exercise.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/exercise/v1/message;exercisev1message";

import "contracts/supporting/exercise/v1/message/taxonomy.proto";

// ExerciseStatus is the exercise lifecycle: DRAFT -> ACTIVE (approve) -> ARCHIVED
// (archive) -> ACTIVE (restore). DRAFT means awaiting an admin's approval.
enum ExerciseStatus {
  reserved 2;
  reserved "EXERCISE_STATUS_PENDING_APPROVAL";
  EXERCISE_STATUS_UNSPECIFIED = 0;
  EXERCISE_STATUS_DRAFT = 1;
  EXERCISE_STATUS_ACTIVE = 3;
  EXERCISE_STATUS_ARCHIVED = 4;
}

enum ExerciseMeasurementType {
  EXERCISE_MEASUREMENT_TYPE_UNSPECIFIED = 0;
  EXERCISE_MEASUREMENT_TYPE_REPS = 1;
  EXERCISE_MEASUREMENT_TYPE_DURATION = 2;
}

// ExerciseInfo is one catalog exercise. force and mechanic are UNSPECIFIED
// when the source has no value; images are absolute URLs.
message ExerciseInfo {
  reserved 3, 4, 5, 6, 7, 8, 9, 11, 13;
  reserved "body_part_id", "equipment_id", "target_muscle_id", "secondary_muscle_ids",
    "thumbnail_url", "media_url", "difficulty", "tag_ids";

  string id = 1;
  string name = 2;
  string video_url = 10;
  int32 default_rest_seconds = 12;
  ExerciseStatus status = 14;
  bool has_ai_supported = 15;
  ExerciseMeasurementType measurement_type = 16;
  string slug = 17;
  MuscleGroup primary_muscle = 18;
  repeated MuscleGroup secondary_muscles = 19;
  Equipment equipment = 20;
  ExerciseCategory category = 21;
  ExerciseLevel level = 22;
  ExerciseForce force = 23;
  ExerciseMechanic mechanic = 24;
  repeated string instructions = 25;
  repeated string images = 26;
  string motion_slug = 27;
}

// CreateExerciseRequest creates a catalog exercise. A non-empty slug marks an
// exercise imported from free-exercise-db (slug = source id); without it the
// exercise is custom and the slug is derived from the name. force and mechanic
// may be UNSPECIFIED (no value); images are paths relative to the media base
// URL or absolute URLs.
message CreateExerciseRequest {
  reserved 2, 3, 4, 5, 6, 7, 8, 10, 12;
  reserved "body_part_id", "equipment_id", "target_muscle_id", "secondary_muscle_ids",
    "thumbnail_url", "media_url", "difficulty", "tag_ids";

  string name = 1;
  string video_url = 9;
  int32 default_rest_seconds = 11;
  ExerciseMeasurementType measurement_type = 13;
  ExerciseStatus status = 14;
  string slug = 15;
  MuscleGroup primary_muscle = 16;
  repeated MuscleGroup secondary_muscles = 17;
  Equipment equipment = 18;
  ExerciseCategory category = 19;
  ExerciseLevel level = 20;
  ExerciseForce force = 21;
  ExerciseMechanic mechanic = 22;
  repeated string instructions = 23;
  repeated string images = 24;
  string motion_slug = 25;
}

message CreateExerciseResponse {
  ExerciseInfo exercise = 1;
}

// UpdateExerciseRequest replaces the editable fields of an exercise; the slug
// is immutable.
message UpdateExerciseRequest {
  reserved 3, 4, 5, 6, 7, 8, 9, 11, 13;
  reserved "body_part_id", "equipment_id", "target_muscle_id", "secondary_muscle_ids",
    "thumbnail_url", "media_url", "difficulty", "tag_ids";

  string id = 1;
  string name = 2;
  string video_url = 10;
  int32 default_rest_seconds = 12;
  ExerciseStatus status = 14 [deprecated = true];
  ExerciseMeasurementType measurement_type = 15;
  MuscleGroup primary_muscle = 16;
  repeated MuscleGroup secondary_muscles = 17;
  Equipment equipment = 18;
  ExerciseCategory category = 19;
  ExerciseLevel level = 20;
  ExerciseForce force = 21;
  ExerciseMechanic mechanic = 22;
  repeated string instructions = 23;
  repeated string images = 24;
  string motion_slug = 25;
}

message UpdateExerciseResponse {
  ExerciseInfo exercise = 1;
}

message DeleteExerciseRequest {
  string id = 1;
}

message DeleteExerciseResponse {
  bool success = 1;
}

message RestoreExerciseRequest {
  string id = 1;
}

message RestoreExerciseResponse {
  ExerciseInfo exercise = 1;
}

message ApproveExerciseRequest {
  string id = 1;
}

message ApproveExerciseResponse {
  ExerciseInfo exercise = 1;
}

message GetExerciseRequest {
  string id = 1;
}

message GetExerciseResponse {
  ExerciseInfo exercise = 1;
}

message GetRandomExerciseRequest {}

message GetRandomExerciseResponse {
  ExerciseInfo exercise = 1;
}

// SearchExercisesRequest filters the catalog. Repeated filters match any of
// the given values; exclude_muscles drops exercises whose primary or any
// secondary muscle is listed.
message SearchExercisesRequest {
  reserved 1, 2, 3, 4, 5, 6, 8;
  reserved "body_part_id", "equipment_id", "avoid_injury_areas", "tag_ids", "target_muscle_id",
    "secondary_muscle_ids", "difficulty";

  string keyword = 7;
  int32 limit = 9;
  int32 offset = 10;
  ExerciseMeasurementType measurement_type = 11;
  ExerciseStatus status = 12;
  bool include_all_statuses = 13;
  optional bool has_motion_spec = 14;
  optional bool has_voice_spec = 15;
  repeated MuscleGroup primary_muscles = 16;
  repeated MuscleGroup secondary_muscles = 17;
  repeated Equipment equipment = 18;
  repeated ExerciseCategory categories = 19;
  repeated ExerciseLevel levels = 20;
  optional ExerciseForce force = 21;
  optional ExerciseMechanic mechanic = 22;
  repeated MuscleGroup exclude_muscles = 23;
  optional bool has_ai_supported = 24;
}

message SearchExercisesResponse {
  repeated ExerciseInfo exercises = 1;
  int32 total_count = 2;
}
