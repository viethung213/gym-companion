syntax = "proto3";

package contracts.supporting.gamification.v1.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/supporting/gamification/v1/event;gamificationv1event";

message StreakAdvanced {
  string user_id = 1;
  int32 new_streak = 2;
  int32 longest_streak = 3;
  string activity_date = 4; // YYYY-MM-DD
  string activity_type = 5; // "WORKOUT", "NUTRITION"
  google.protobuf.Timestamp advanced_at = 6;
}
