syntax = "proto3";

package contracts.core.nutrition.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/nutrition/v1/message;nutritionv1message";

message Macros {
  float protein_grams = 1;
  float carb_grams = 2;
  float fat_grams = 3;
}

message MealOption {
  string meal_name = 1;
  string price_tier = 2; // "LOW", "MEDIUM", "HIGH"
  float calories = 3;
  float protein = 4;
  float carbs = 5;
  float fat = 6;
  string description = 7;
  repeated string recipe_steps = 8;
}

message DailyMeals {
  repeated MealOption breakfast = 1;
  repeated MealOption lunch = 2;
  repeated MealOption dinner = 3;
  repeated MealOption snack = 4;
}

message GetTodayMenuRequest {
  string user_id = 1;
}

message GetTodayMenuResponse {
  float target_calories = 1;
  Macros macros = 2;
  DailyMeals meals = 3;
}

message LogMealRequest {
  string user_id = 1;
  string meal_name = 2;
  string meal_type = 3; // "BREAKFAST", "LUNCH", "DINNER", "SNACK"
  float calories = 4;
  float protein = 5;
  float carbs = 6;
  float fat = 7;
  string logged_at = 8;
}

message LogMealResponse {
  string meal_log_id = 1;
  bool success = 2;
  string message = 3;
}

message MealLogItem {
  string meal_log_id = 1;
  string meal_name = 2;
  string meal_type = 3;
  float calories = 4;
  float protein = 5;
  float carbs = 6;
  float fat = 7;
  string logged_at = 8;
}

message GetNutritionHistoryRequest {
  string user_id = 1;
  string start_date = 2; // YYYY-MM-DD
  string end_date = 3;   // YYYY-MM-DD
}

message GetNutritionHistoryResponse {
  repeated MealLogItem meals = 1;
}

message GetNutritionSummaryRequest {
  string user_id = 1;
}

message GetNutritionSummaryResponse {
  float target_calories = 1;
  Macros target_macros = 2;
  float consumed_calories = 3;
  Macros consumed_macros = 4;
}

message RecalibratePlanWithPantryRequest {
  string user_id = 1;
  repeated string available_ingredients = 2;
}

message RecalibratePlanWithPantryResponse {
  float target_calories = 1;
  Macros macros = 2;
  DailyMeals meals = 3;
  string message = 4;
}

message CreateFoodItemRequest {
  string name = 1;
  string category = 2; // PROTEIN, CARB, VEGGIE, FAT, NUTIFOOD
  float calories_per_100g = 3;
  float protein_per_100g = 4;
  float carbs_per_100g = 5;
  float fat_per_100g = 6;
  repeated string allergen_tags = 7;
  string protein_source = 8;
  string carb_source = 9;
  bool is_nutifood_product = 10;
}

message CreateFoodItemResponse {
  string food_item_id = 1;
  string status = 2;
  string message = 3;
}

message ApproveFoodItemRequest {
  string food_item_id = 1;
}

message ApproveFoodItemResponse {
  string food_item_id = 1;
  string status = 2;
  bool success = 3;
  string message = 4;
}

message ImprovementAreaProto {
  string area = 1;
  float current_avg = 2;
  float target = 3;
  string suggestion = 4;
  string priority = 5; // "HIGH", "MEDIUM", "LOW"
}

message RecommendedAdjustmentsProto {
  float calories_delta = 1;
  float protein_ratio_delta = 2;
  repeated string focus_foods = 3;
}

message GetNutritionInsightRequest {
  string user_id = 1;
  string goal_type = 2;  // "WEIGHT_LOSS", "MUSCLE_GAIN", "MAINTENANCE"
  int32 range_days = 3;  // số ngày phân tích, mặc định 7
}

message GetNutritionInsightResponse {
  int32 overall_score = 1;
  string summary = 2;
  repeated string strengths = 3;
  repeated ImprovementAreaProto improvement_areas = 4;
  string weekly_trend = 5; // "IMPROVING", "DECLINING", "STABLE"
  RecommendedAdjustmentsProto recommended_adjustments = 6;
}

message MealScheduleItem {
  string meal_type = 1; // "BREAKFAST", "LUNCH", "DINNER", "SNACK"
  string scheduled_time = 2; // e.g. "07:00", "12:00", "15:30", "19:00"
}

message UpdateMealScheduleRequest {
  string user_id = 1;
  repeated MealScheduleItem schedules = 2;
}

message UpdateMealScheduleResponse {
  bool success = 1;
  string message = 2;
  repeated MealScheduleItem schedules = 3;
}

