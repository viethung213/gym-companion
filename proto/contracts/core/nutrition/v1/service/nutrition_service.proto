syntax = "proto3";

package contracts.core.nutrition.v1.service;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/nutrition/v1/service;nutritionv1service";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "contracts/core/nutrition/v1/message/nutrition_messages.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "AI Nutrition Engine API"
    version: "1.0"
    description: "API tính toán calo/macros và đề xuất thực đơn cá nhân hóa."
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer access token (Format: Bearer <token>)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

service NutritionService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Nutrition / User"
    description: "API dành cho người dùng tra cứu thực đơn, ghi nhật ký ăn uống và phân tích dinh dưỡng"
  };

  // Lấy thực đơn gợi ý trong ngày dựa theo TDEE và mục tiêu người dùng
  rpc GetTodayMenu (contracts.core.nutrition.v1.message.GetTodayMenuRequest) returns (contracts.core.nutrition.v1.message.GetTodayMenuResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/nutrition/today"
    };
  }

  // Ghi chép bữa ăn thực tế đã tiêu thụ
  rpc LogMeal (contracts.core.nutrition.v1.message.LogMealRequest) returns (contracts.core.nutrition.v1.message.LogMealResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/nutrition/meals"
      body: "*"
    };
  }

  // Lấy lịch sử log bữa ăn theo dải ngày
  rpc GetNutritionHistory (contracts.core.nutrition.v1.message.GetNutritionHistoryRequest) returns (contracts.core.nutrition.v1.message.GetNutritionHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/nutrition/history"
    };
  }

  // Lấy tổng quan lượng Calo/Macros hấp thụ trong ngày hôm nay so với chỉ tiêu
  rpc GetNutritionSummary (contracts.core.nutrition.v1.message.GetNutritionSummaryRequest) returns (contracts.core.nutrition.v1.message.GetNutritionSummaryResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/nutrition/summary"
    };
  }

  // Tái hiệu chỉnh thực đơn động theo nguyên liệu có sẵn trong tủ lạnh (BR-NU-06)
  rpc RecalibratePlanWithPantry (contracts.core.nutrition.v1.message.RecalibratePlanWithPantryRequest) returns (contracts.core.nutrition.v1.message.RecalibratePlanWithPantryResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/nutrition/recalibrate-pantry"
      body: "*"
    };
  }

  // Đăng ký thực phẩm mới vào danh mục (Dành cho đối tác / sản phẩm NutiFood)
  rpc CreateFoodItem (contracts.core.nutrition.v1.message.CreateFoodItemRequest) returns (contracts.core.nutrition.v1.message.CreateFoodItemResponse) {
    option (google.api.http) = {
      post: "/api/v1/nutrition/food-items"
      body: "*"
    };
  }

  // Lấy insight AI phân tích xu hướng dinh dưỡng và hướng cải thiện cá nhân hóa
  rpc GetNutritionInsight (contracts.core.nutrition.v1.message.GetNutritionInsightRequest) returns (contracts.core.nutrition.v1.message.GetNutritionInsightResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}/nutrition/insight"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "AI Nutrition Insight"
      description: "Phân tích lịch sử dinh dưỡng và đưa ra hướng cải thiện từ AI"
    };
  }

  // Cập nhật lịch trình/thời gian các bữa ăn theo tùy chỉnh cá nhân
  rpc UpdateMealSchedule (contracts.core.nutrition.v1.message.UpdateMealScheduleRequest) returns (contracts.core.nutrition.v1.message.UpdateMealScheduleResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{user_id}/nutrition/meal-schedule"
      body: "*"
    };
  }
}

// Service dành riêng cho Admin quản lý danh mục thực phẩm
service AdminNutritionService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Nutrition / Admin"
    description: "API dành cho Admin quản lý và phê duyệt danh mục thực phẩm"
  };

  // Admin phê duyệt thực phẩm vào danh mục Active
  rpc ApproveFoodItem (contracts.core.nutrition.v1.message.ApproveFoodItemRequest) returns (contracts.core.nutrition.v1.message.ApproveFoodItemResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/nutrition/food-items/{food_item_id}/approve"
    };
  }
}
