syntax = "proto3";

package contracts.core.coaching.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/coaching/v1/message;coachingv1message";

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

enum RoadmapStatus {
  ROADMAP_STATUS_UNSPECIFIED = 0;
  ROADMAP_STATUS_ACTIVE = 1;
  ROADMAP_STATUS_COMPLETED = 2;
}

enum SessionPlanStatus {
  SESSION_PLAN_STATUS_UNSPECIFIED = 0;
  SESSION_PLAN_STATUS_PENDING = 1;   // Chưa tập / chờ tập
  SESSION_PLAN_STATUS_COMPLETED = 2; // Đã hoàn thành buổi tập
  SESSION_PLAN_STATUS_SKIPPED = 3;   // Đã bỏ qua / không tập
}

enum SessionPlanSource {
  SESSION_PLAN_SOURCE_UNSPECIFIED = 0;
  SESSION_PLAN_SOURCE_COACH_SCHEDULED = 1;
  SESSION_PLAN_SOURCE_USER_ADHOC = 2;
}

enum RoadmapPhase {
  ROADMAP_PHASE_UNSPECIFIED = 0;
  ROADMAP_PHASE_ACCUMULATION = 1; // Tích lũy khối lượng
  ROADMAP_PHASE_OVERLOAD = 2;     // Tăng tải lũy tiến
  ROADMAP_PHASE_PEAK = 3;         // Đỉnh cao phong độ
  ROADMAP_PHASE_DELOAD = 4;       // Giảm tải phục hồi
}

message InitiateRoadmapRequest {
  string user_id = 1;
}

message InitiateRoadmapResponse {
  Roadmap roadmap = 1;
}

message ListRoadmapsRequest {
  string user_id = 1;
  RoadmapStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListRoadmapsResponse {
  repeated Roadmap roadmaps = 1;
  string next_page_token = 2;
}

message GetRoadmapRequest {
  string user_id = 1;
  string roadmap_id = 2;
}

message GetRoadmapResponse {
  Roadmap roadmap = 1;
}

message GetActiveRoadmapRequest {
  string user_id = 1;
}

message GetActiveRoadmapResponse {
  Roadmap roadmap = 1;
}

message GetSessionPlanRequest {
  string user_id = 1;
  string session_plan_id = 2;
}

message GetSessionPlanResponse {
  SessionPlan session_plan = 1;
}

message RegenerateScheduleRequest {
  string user_id = 1;
  string roadmap_id = 2;
  string reason = 3;
}

message RegenerateScheduleResponse {
  Roadmap roadmap = 1;
}

message Roadmap {
  string roadmap_id = 1;
  string user_id = 2;
  RoadmapStatus status = 3;
  google.type.Date start_date = 4;
  google.type.Date end_date = 5;
  repeated WeekPlan week_plans = 6;
}

message WeekPlan {
  string week_plan_id = 1;
  string roadmap_id = 2;
  string user_id = 3;
  int32 week_number = 4;
  RoadmapPhase phase = 5;
  float target_rpe = 6;
  google.type.Date start_date = 7;
  google.type.Date end_date = 8;
  string muscle_split_type = 9;
  repeated DayPlan day_plans = 10;
}

message DayPlan {
  string day_plan_id = 1;
  string week_plan_id = 2;
  string roadmap_id = 3;
  string user_id = 4;
  google.type.Date scheduled_date = 5;
  repeated SessionPlan session_plans = 7;
}

message SessionPlan {
  string session_plan_id = 1;
  string day_plan_id = 2;
  string week_plan_id = 3;
  string roadmap_id = 4;
  string user_id = 5;
  google.type.Date scheduled_date = 6;
  string slot_time = 7;
  SessionPlanStatus status = 8;
  repeated string target_muscle_groups = 9;
  WorkoutPrescription prescription = 10;
  string reasoning = 11;
  google.protobuf.Timestamp generated_at = 12;
  SessionPlanSource source = 13;
}

message WorkoutPrescription {
  repeated PrescribedExercise warm_ups = 1;
  repeated PrescribedExercise main_exercises = 2;
  repeated PrescribedExercise cool_downs = 3;
}

message PrescribedExercise {
  string exercise_id = 1;
  string exercise_name = 2;
  int32 target_sets = 3;
  int32 target_reps = 4;
  float target_weight = 5;
  int32 duration_seconds = 6;
  string notes = 7;
  int32 rest_set_sec = 8;
  int32 rest_exercise_sec = 9;
  float target_rpe = 10;
}

message CreateAdhocSessionPlanRequest {
  string user_id = 1;
  repeated string exercise_ids = 2;
}

message CreateAdhocSessionPlanResponse {
  SessionPlan session_plan = 1;
}
