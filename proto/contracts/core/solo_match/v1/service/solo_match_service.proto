syntax = "proto3";

package contracts.core.solo_match.v1.service;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/solo_match/v1/service;solomatchv1service";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "contracts/core/solo_match/v1/message/match_message.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Solo Match Service API"
    version: "1.0"
    description: "API quản lý hàng đợi và trận đấu Solo Match 1v1 đối kháng thể lực giữa người dùng hoặc với Bot"
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer access token (Format: Bearer <token>)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

service SoloMatchService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "Solo Match / User"
    description: "API quản lý hàng đợi ghép trận và kết quả Solo Match"
  };

  // Client kết nối stream để vào hàng đợi và nhận thông báo khi ghép trận thành công (hoặc với Bot)
  rpc JoinQueue(contracts.core.solo_match.v1.message.JoinQueueRequest) 
      returns (stream contracts.core.solo_match.v1.message.JoinQueueResponse) {
    option (google.api.http) = {
      post: "/api/v1/solo-matches/queue"
      body: "*"
    };
  }

  // Hủy tìm trận khi đang trong hàng đợi
  rpc CancelQueue(contracts.core.solo_match.v1.message.CancelQueueRequest) 
      returns (contracts.core.solo_match.v1.message.CancelQueueResponse) {
    option (google.api.http) = {
      post: "/api/v1/solo-matches/queue/cancel"
      body: "*"
    };
  }

  // Xem chi tiết một trận đấu
  rpc GetMatch(contracts.core.solo_match.v1.message.GetMatchRequest) 
      returns (contracts.core.solo_match.v1.message.GetMatchResponse) {
    option (google.api.http) = {
      get: "/api/v1/solo-matches/{match_id}"
    };
  }

  // Lịch sử các trận đấu của người dùng
  rpc GetMatchHistory(contracts.core.solo_match.v1.message.GetMatchHistoryRequest) 
      returns (contracts.core.solo_match.v1.message.GetMatchHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/solo-matches/history"
    };
  }
}
