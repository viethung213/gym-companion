syntax = "proto3";

package contracts.core.workout_execution.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/workout_execution/v1/message;workoutexecutionv1message";

import "google/protobuf/timestamp.proto";

message StartWorkoutSessionRequest {
  string plan_id = 1;
}

message StartWorkoutSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

message StartScheduledWorkoutSessionRequest {
  string session_id = 1;
}

message StartScheduledWorkoutSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

// Log cho từng rep (được tính toán từ Client và gửi lên Server)
message RepLog {
  int32 rep_number = 1;
  float rom_percentage = 2;
  repeated string error_codes = 3; // Ví dụ: ["ERR_BACK_ARCH", "ERR_KNEE_OVER_TOE"]
  map<string, float> joint_angles = 4; // Map các góc khớp đã tính toán (ví dụ: {"knee_angle": 120.5})
}

// Request/Response cho LogWorkoutSet
message LogWorkoutSetRequest {
  string session_id = 1;
  int32 set_number = 2;
  string exercise_id = 3;
  int32 target_reps = 4;
  int32 actual_reps = 5;
  float weight = 6;
  optional float form_score = 7; // Sử dụng optional để hỗ trợ N/A cho bài tập Phi AI
  float rpe = 8; // Độ gắng sức (Rate of Perceived Exertion)
  repeated RepLog reps = 9;
  string camera_angle = 10; // Góc quay camera thực tế lúc tập (ví dụ: "side", "front")
}

message LogWorkoutSetResponse {
  string set_log_id = 1;
}

message AbortWorkoutSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message AbortWorkoutSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp aborted_at = 2;
}

// Request/Response cho CompleteWorkoutSession
message CompleteWorkoutSessionRequest {
  string session_id = 1;
  optional bool confirm_overload = 2;
  optional float weight_update_kg = 3;
}

message CompleteWorkoutSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp completed_at = 2;
  int32 total_sets = 3;
  float total_volume = 4;
  optional float average_form_score = 5; // Sử dụng optional nếu toàn bài phi AI
  float average_rpe = 6;
}

message ErrorLog {
  string error_code = 1;
  string severity = 2;
  google.protobuf.Timestamp timestamp = 3;
  int32 set_number = 4;
  int32 rep_number = 5;
  string exercise_id = 6;
}

message SyncWorkoutLogsRequest {
  string session_id = 1;
  repeated ErrorLog errors = 2;
}

message SyncWorkoutLogsResponse {}

message DialogueOption {
  string text = 1;
  string audio_url = 2;
}

message DialogueSeverities {
  repeated DialogueOption severity_1 = 1;
  repeated DialogueOption severity_2 = 2;
}

message DialogueEngineConfig {
  string personality_id = 1;
  map<string, float> cooldowns = 2;
  map<string, DialogueSeverities> dialogue_map = 3;
}

message GetMotionSpecificationRequest {
  string exercise_id = 1;
  string coach_personality = 2;
}

message GetMotionSpecificationResponse {
  string exercise_id = 1;
  string onnx_detector_url = 2;
  string onnx_skeleton_url = 3;
  string local_rules_url = 4;
  string dialogue_engine_url = 5;
  string recommended_camera_angle = 6;
}


message PersonalRecord {
  string exercise_id = 1;
  float one_rep_max = 2;
  float weight = 3;
  int32 reps = 4;
  google.protobuf.Timestamp achieved_at = 5;
}

message GetPersonalRecordsRequest {
  repeated string exercise_ids = 1;
}

message AdminGetPersonalRecordsRequest {
  string user_id = 1;
  repeated string exercise_ids = 2;
}

message GetPersonalRecordsResponse {
  repeated PersonalRecord records = 1;
}

message AdminGetPersonalRecordsResponse {
  repeated PersonalRecord records = 1;
}

message GetWorkoutSessionErrorsRequest {
  string session_id = 1;
}

message GetWorkoutSessionErrorsResponse {
  string session_id = 1;
  repeated ErrorLog errors = 2;
}

message GetWorkoutHistoryRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message AdminGetWorkoutHistoryRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message WorkoutSessionSummary {
  string session_id = 1;
  google.protobuf.Timestamp date = 2;
  int32 total_sets = 3;
  float total_volume = 4;
  optional float average_form_score = 5; // Dạng optional (N/A nếu buổi tập phi AI)
}

message GetWorkoutHistoryResponse {
  repeated WorkoutSessionSummary sessions = 1;
}

message AdminGetWorkoutHistoryResponse {
  repeated WorkoutSessionSummary sessions = 1;
}

message UpdateMotionSpecificationRequest {
  string exercise_id = 1;
  string onnx_detector_url = 2;
  string onnx_skeleton_url = 3;
  string local_rules_url = 4;
  string dialogue_engine_url = 5;
  string recommended_camera_angle = 6;
}


message UpdateMotionSpecificationResponse {
  string exercise_id = 1;
  google.protobuf.Timestamp updated_at = 2;
  bool is_ready = 3;
}

message DeleteMotionSpecificationRequest {
  string exercise_id = 1;
}

message DeleteMotionSpecificationResponse {
  string exercise_id = 1;
  bool success = 2;
}

message ListMotionSpecificationsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListMotionSpecificationsResponse {
  repeated GetMotionSpecificationResponse motion_specifications = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetPresignedUploadURLRequest {
  string file_name = 1;
  string content_type = 2;
}

message GetPresignedUploadURLResponse {
  string upload_url = 1;
  string file_url = 2;
  string file_name = 3;
}

enum MotionAssetType {
  MOTION_ASSET_TYPE_UNSPECIFIED = 0;
  MOTION_ASSET_TYPE_POSE_RULES = 1;
  MOTION_ASSET_TYPE_DIALOGUE_CONFIG = 2;
}

message PatchMotionSpecificationAssetRequest {
  string exercise_id = 1;
  MotionAssetType asset_type = 2;
  string patch_json = 3;
  repeated string delete_keys = 4;
}

message PatchMotionSpecificationAssetResponse {
  string exercise_id = 1;
  MotionAssetType asset_type = 2;
  string file_url = 3;
  google.protobuf.Timestamp updated_at = 4;
}


