syntax = "proto3";

package contracts.core.workout_execution.v1.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/core/workout_execution/v1/event;workoutexecutionv1event";

message WorkoutSessionShared {
  string session_id = 1;
  string user_id = 2;
  string caption = 3;
  repeated string media_urls = 4;
  string visibility = 5;
  string workout_title = 6;
  int32 duration_seconds = 7;
  int32 total_sets = 8;
  float total_volume_kg = 9;
  google.protobuf.Timestamp shared_at = 10;
  int32 exercise_count = 11;
}
