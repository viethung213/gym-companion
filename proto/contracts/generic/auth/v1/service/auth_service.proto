syntax = "proto3";

package contracts.generic.auth.v1.service;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/generic/auth/v1/service;authv1service";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "contracts/generic/auth/v1/message/auth_messages.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Identity & Authentication API"
    version: "1.0"
    description: "API xác thực người dùng bằng tài khoản Google/Facebook."
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Bearer access token (Format: Bearer <token>)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
};

service AuthService {
  // Làm mới access token bằng refresh token
  rpc RefreshToken (contracts.generic.auth.v1.message.RefreshTokenRequest) returns (contracts.generic.auth.v1.message.RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đăng xuất và hủy phiên làm việc
  rpc Logout (contracts.generic.auth.v1.message.LogoutRequest) returns (contracts.generic.auth.v1.message.LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
    };
  }

  // Lấy URL đăng nhập OAuth (Google/Facebook)
  rpc GetOAuthLoginURL (contracts.generic.auth.v1.message.GetOAuthLoginURLRequest) returns (contracts.generic.auth.v1.message.GetOAuthLoginURLResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/oauth/login"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Xoay khóa ký JWT thủ công (chỉ dành cho Admin)
  rpc RotateKeys (contracts.generic.auth.v1.message.RotateKeysRequest) returns (contracts.generic.auth.v1.message.RotateKeysResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/keys/rotate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Lấy danh sách Public Keys dưới dạng JWKS
  rpc GetJWKS (contracts.generic.auth.v1.message.GetJWKSRequest) returns (contracts.generic.auth.v1.message.GetJWKSResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/jwks"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đăng nhập bằng tài khoản Google hoặc Facebook
  rpc LoginWithOAuth (contracts.generic.auth.v1.message.LoginWithOAuthRequest) returns (contracts.generic.auth.v1.message.LoginWithOAuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login/oauth"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đăng ký tài khoản mới bằng Email hoặc Số điện thoại kèm Mật khẩu
  rpc Register (contracts.generic.auth.v1.message.RegisterRequest) returns (contracts.generic.auth.v1.message.RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đăng nhập bằng Email hoặc Số điện thoại kèm Mật khẩu
  rpc Login (contracts.generic.auth.v1.message.LoginRequest) returns (contracts.generic.auth.v1.message.LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Yêu cầu gửi mã OTP qua Email hoặc SMS
  rpc SendOTP (contracts.generic.auth.v1.message.SendOTPRequest) returns (contracts.generic.auth.v1.message.SendOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/otp/send"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Xác thực mã OTP nhận được
  rpc VerifyOTP (contracts.generic.auth.v1.message.VerifyOTPRequest) returns (contracts.generic.auth.v1.message.VerifyOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/otp/verify"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đổi mật khẩu cho người dùng đã đăng nhập (yêu cầu Bearer Token)
  rpc ChangePassword (contracts.generic.auth.v1.message.ChangePasswordRequest) returns (contracts.generic.auth.v1.message.ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password/change"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
    };
  }

  // Đổi lại mật khẩu mới sau khi đã xác thực mã OTP
  rpc ResetPassword (contracts.generic.auth.v1.message.ResetPasswordRequest) returns (contracts.generic.auth.v1.message.ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password/reset"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / User"
      security: {} // Public bypass
    };
  }

  // Đăng ký nâng cấp tài khoản người dùng thành Brand
  rpc RegisterBrand (contracts.generic.auth.v1.message.RegisterBrandRequest) returns (contracts.generic.auth.v1.message.RegisterBrandResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/brand/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Brand"
    };
  }

  // Admin phê duyệt yêu cầu nâng cấp Brand
  rpc ApproveBrand (contracts.generic.auth.v1.message.ApproveBrandRequest) returns (contracts.generic.auth.v1.message.ApproveBrandResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/brand-requests/{request_id}/approve"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Admin từ chối yêu cầu nâng cấp Brand
  rpc RejectBrand (contracts.generic.auth.v1.message.RejectBrandRequest) returns (contracts.generic.auth.v1.message.RejectBrandResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/brand-requests/{request_id}/reject"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Admin lấy danh sách các yêu cầu nâng cấp Brand
  rpc ListBrandRequests (contracts.generic.auth.v1.message.ListBrandRequestsRequest) returns (contracts.generic.auth.v1.message.ListBrandRequestsResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/admin/brand-requests"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Admin lấy danh sách người dùng có lọc theo vai trò, trạng thái, tìm kiếm và phân trang
  rpc ListUsers (contracts.generic.auth.v1.message.ListUsersRequest) returns (contracts.generic.auth.v1.message.ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/admin/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Admin khóa tài khoản người dùng
  rpc LockUser (contracts.generic.auth.v1.message.LockUserRequest) returns (contracts.generic.auth.v1.message.LockUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/users/{user_id}/lock"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }

  // Admin mở khóa tài khoản người dùng
  rpc UnlockUser (contracts.generic.auth.v1.message.UnlockUserRequest) returns (contracts.generic.auth.v1.message.UnlockUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/users/{user_id}/unlock"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Authentication / Admin"
    };
  }
}



