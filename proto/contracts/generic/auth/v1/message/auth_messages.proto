syntax = "proto3";

package contracts.generic.auth.v1.message;

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/generic/auth/v1/message;authv1message";

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetOAuthLoginURLRequest {
  string provider = 1; // "google" or "facebook"
  string redirect_uri = 2; // Optional Frontend override callback URL
}

message GetOAuthLoginURLResponse {
  string login_url = 1;
}

message RotateKeysRequest {}

message RotateKeysResponse {
  string message = 1;
}

message GetJWKSRequest {}

message JWKKey {
  string kty = 1; // "RSA"
  string use = 2; // "sig"
  string alg = 3; // "RS256"
  string kid = 4;
  string n = 5; // Modulus (Base64URL encoded)
  string e = 6; // Exponent (Base64URL encoded)
}

message GetJWKSResponse {
  repeated JWKKey keys = 1;
}

message LoginWithOAuthRequest {
  string provider = 1; // "google" or "facebook"
  string code = 2;
  string redirect_uri = 3; // The redirect URL used during the initial request
  string state = 4;
}

message LoginWithOAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
}

message RegisterRequest {
  string identifier = 1;    // Email address or Domestic/E.164 Phone
  string password = 2;
  string full_name = 3;
  string gender = 4;        // "MALE", "FEMALE", "OTHER"
  string date_of_birth = 5; // Format: "YYYY-MM-DD"
}

message RegisterResponse {
  string message = 1;
}

message LoginRequest {
  string identifier = 1; // Email address or Domestic/E.164 Phone
  string password = 2;
}

message SendOTPRequest {
  string identifier = 1; // Email address or Phone (+84...)
  string purpose = 2;    // "register", "login", "reset_password", "verify_phone", "verify_email", "change_password"
}

message SendOTPResponse {
  bool success = 1;
  string message = 2;
  int64 expires_in_seconds = 3;
  string otp_token = 4; // Mã định danh phiên OTP (UI lưu và gửi ngầm khi verify)
}

message VerifyOTPRequest {
  string otp_token = 1; // Mã phiên OTP nhận từ SendOTPResponse
  string code = 2;      // Mã OTP 6 chữ số do người dùng nhập
}

message VerifyOTPResponse {
  bool valid = 1;
  string reset_token = 2; // One-time token used for password reset if purpose is "reset_password"
  string message = 3;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
  string confirm_password = 3; // Mật khẩu mới nhập lại để đối chiếu
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string reset_token = 1; // One-time reset token returned from VerifyOTP
  string new_password = 2;
  string confirm_password = 3; // Mật khẩu mới nhập lại để đối chiếu
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

enum BrandRequestStatus {
  BRAND_REQUEST_STATUS_UNSPECIFIED = 0;
  BRAND_REQUEST_STATUS_PENDING = 1;
  BRAND_REQUEST_STATUS_APPROVED = 2;
  BRAND_REQUEST_STATUS_REJECTED = 3;
}

message BrandRequest {
  string id = 1;
  string user_id = 2;
  string brand_name = 3;
  string description = 4;
  string contact_phone = 5;
  string address = 6;
  BrandRequestStatus status = 7;
  string rejection_reason = 8;
  string reviewed_by = 9;
  string created_at = 10;
  string reviewed_at = 11;
  string updated_at = 12;
}

message RegisterBrandRequest {
  string brand_name = 1;
  string description = 2;
  string contact_phone = 3;
  string address = 4;
}

message RegisterBrandResponse {
  bool success = 1;
  string message = 2;
}

message ApproveBrandRequest {
  string request_id = 1;
}

message ApproveBrandResponse {
  bool success = 1;
  string message = 2;
}

message RejectBrandRequest {
  string request_id = 1;
  string reason = 2;
}

message RejectBrandResponse {
  bool success = 1;
  string message = 2;
}

message ListBrandRequestsRequest {
  BrandRequestStatus status = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListBrandRequestsResponse {
  repeated BrandRequest items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UserInfo {
  string id = 1;
  string full_name = 2;
  // Vai trò người dùng trong hệ thống: "admin", "user", "brand"
  string role = 3;
  // Trạng thái tài khoản: "active", "locked"
  string status = 4;
  string identity_type = 5;
  string identifier = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListUsersRequest {
  // Lọc theo vai trò: "admin", "user", "brand" (để trống nếu lấy tất cả)
  string role = 1;
  // Lọc theo trạng thái: "active", "locked" (để trống nếu lấy tất cả)
  string status = 2;
  // Tìm kiếm theo họ tên, email hoặc số điện thoại
  string search = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListUsersResponse {
  repeated UserInfo items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message LockUserRequest {
  string user_id = 1;
  string reason = 2;
}

message LockUserResponse {
  bool success = 1;
  string message = 2;
}

message UnlockUserRequest {
  string user_id = 1;
}

message UnlockUserResponse {
  bool success = 1;
  string message = 2;
}



