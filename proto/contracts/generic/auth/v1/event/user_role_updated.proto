syntax = "proto3";

package contracts.generic.auth.v1.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/generic/auth/v1/event;authv1event";

// UserRoleUpdated phát ra khi vai trò của một tài khoản thay đổi (ví dụ: được phê duyệt thành Brand).
message UserRoleUpdated {
  string user_id = 1;
  string old_role = 2;
  string new_role = 3;
  google.protobuf.Timestamp updated_at = 4;
}
