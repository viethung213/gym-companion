syntax = "proto3";

package contracts.generic.auth.v1.event;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/viethung213/gym-companion/internal/gen/go/contracts/generic/auth/v1/event;authv1event";

message UserRegistered {
  string user_id = 1;
  string identity_type = 2;
  string identifier = 3;
  string full_name = 4;
  google.protobuf.Timestamp registered_at = 5;
  string avatar_url = 6;
  string gender = 7;
  string date_of_birth = 8;
}
