version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fitai-redis-test
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fitai-network

networks:
  fitai-network:
    name: fitai-network
    external: true

volumes:
  redis-test-data:
