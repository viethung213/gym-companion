# ==============================================================================
# FITAI POSTGRESQL OPTIMIZED CONFIGURATION (VPS 2 Cores / 4 GB RAM)
# ==============================================================================
listen_addresses = '*'
port = 5432

# 1. CONNECTIONS & MEMORY ALLOCATION
max_connections = 200
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# 2. WRITE AHEAD LOG (WAL) & CHECKPOINTS
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
min_wal_size = 80MB
max_wal_size = 1GB

# 3. QUERY PLANNER & COSTING (SSD Disk)
random_page_cost = 1.1
effective_io_concurrency = 200

# 4. LOGGING & TIMEZONE
log_timezone = 'UTC'
timezone = 'UTC'
client_encoding = 'utf8'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
