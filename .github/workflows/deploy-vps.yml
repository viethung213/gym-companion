name: Deploy to Single VPS (CD)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service cụ thể cần deploy (all, gateway, core, ai, kafka, redis)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gateway
          - core
          - ai
          - kafka
          - redis
      tag:
        description: 'Image tag cần deploy (mặc định: latest)'
        required: false
        default: 'latest'
        type: string

  workflow_run:
    workflows:
      - "Test & Publish Gateway Docker Image"
      - "Publish Dedicated Kafka Docker Image"
      - "Publish Dedicated Redis Docker Image"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-vps:
    name: SSH to VPS & Trigger Deployment
    runs-on: ubuntu-latest
    # Chỉ chạy nếu là dispatch hoặc workflow trước đó build thành công
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Xác định Service cần Deploy
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "service=${{ inputs.service }}" >> $GITHUB_OUTPUT
            echo "tag=${{ inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
          else
            TRIGGER_WORKFLOW="${{ github.event.workflow_run.name }}"
            echo "Triggered by completed workflow: $TRIGGER_WORKFLOW"
            case "$TRIGGER_WORKFLOW" in
              *"Gateway"*)
                echo "service=gateway" >> $GITHUB_OUTPUT
                ;;
              *"Kafka"*)
                echo "service=kafka" >> $GITHUB_OUTPUT
                ;;
              *"Redis"*)
                echo "service=redis" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "service=all" >> $GITHUB_OUTPUT
                ;;
            esac
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Kết nối SSH tới VPS và thực thi deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: TARGET_SERVICE,TARGET_TAG
          script: |
            TARGET_SERVICE="${{ steps.target.outputs.service }}"
            TARGET_TAG="${{ steps.target.outputs.tag }}"
            echo "Executing: /opt/gym-companion/deploy.sh '$TARGET_SERVICE' '$TARGET_TAG'"
            /opt/gym-companion/deploy.sh "$TARGET_SERVICE" "$TARGET_TAG"

