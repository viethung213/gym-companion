name: Module Selective Tests CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      modules: ${{ steps.set-modules.outputs.modules }}
      has_modules: ${{ steps.set-modules.outputs.has_modules }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            global:
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Makefile'
              - 'proto/buf.*'
              - 'proto/buf.gen.yaml'
              - 'internal/gen/**'
              - '.github/workflows/**'
            audio:
              - 'internal/audio/**'
              - 'proto/contracts/generic/audio/**'
            auth:
              - 'internal/auth/**'
              - 'proto/contracts/generic/auth/**'
            coaching:
              - 'internal/coaching/**'
              - 'proto/contracts/core/coaching/**'
            exercise:
              - 'internal/exercise/**'
              - 'proto/contracts/supporting/exercise/**'
            notification:
              - 'internal/notification/**'
              - 'proto/contracts/generic/notification/**'
            nutrition:
              - 'internal/nutrition/**'
              - 'proto/contracts/core/nutrition/**'
            profile:
              - 'internal/profile/**'
              - 'proto/contracts/supporting/profile/**'
            shared:
              - 'internal/shared/**'
            workout_execution:
              - 'internal/workout_execution/**'
              - 'proto/contracts/core/workout_execution/**'

      - name: Compute Target Modules Matrix
        id: set-modules
        run: |
          ALL_MODULES='["audio","auth","coaching","exercise","notification","nutrition","profile","shared","workout_execution"]'
          
          if [ "${{ steps.filter.outputs.global }}" == "true" ]; then
            echo "Global or core shared files changed. Running tests for ALL modules."
            echo "modules=${ALL_MODULES}" >> $GITHUB_OUTPUT
            echo "has_modules=true" >> $GITHUB_OUTPUT
          else
            SELECTED=()
            [ "${{ steps.filter.outputs.audio }}" == "true" ] && SELECTED+=('"audio"')
            [ "${{ steps.filter.outputs.auth }}" == "true" ] && SELECTED+=('"auth"')
            [ "${{ steps.filter.outputs.coaching }}" == "true" ] && SELECTED+=('"coaching"')
            [ "${{ steps.filter.outputs.exercise }}" == "true" ] && SELECTED+=('"exercise"')
            [ "${{ steps.filter.outputs.notification }}" == "true" ] && SELECTED+=('"notification"')
            [ "${{ steps.filter.outputs.nutrition }}" == "true" ] && SELECTED+=('"nutrition"')
            [ "${{ steps.filter.outputs.profile }}" == "true" ] && SELECTED+=('"profile"')
            [ "${{ steps.filter.outputs.shared }}" == "true" ] && SELECTED+=('"shared"')
            [ "${{ steps.filter.outputs.workout_execution }}" == "true" ] && SELECTED+=('"workout_execution"')

            if [ ${#SELECTED[@]} -eq 0 ]; then
              echo "No module code changes detected. Skipping module tests."
              echo "modules=[]" >> $GITHUB_OUTPUT
              echo "has_modules=false" >> $GITHUB_OUTPUT
            else
              JSON_ARRAY=$(IFS=,; echo "[${SELECTED[*]}]")
              echo "Selected modules to test: ${JSON_ARRAY}"
              echo "modules=${JSON_ARRAY}" >> $GITHUB_OUTPUT
              echo "has_modules=true" >> $GITHUB_OUTPUT
            fi
          fi

  build-test-image:
    name: Build Base Test Image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf Stubs
        run: make proto-gen

      - name: Build Base Test Image
        run: |
          make build-test
          docker save fitai-app:test -o test-image.tar

      - name: Upload Test Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: test-image.tar
          retention-days: 1

  run-module-tests:
    name: Test Module (${{ matrix.module }})
    needs: [detect-changes, build-test-image]
    if: ${{ needs.detect-changes.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Test Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-image

      - name: Load Test Image
        run: docker load -i test-image.tar

      - name: Start Test Infrastructure (Postgres & Kafka)
        run: |
          make test-env-up
          sleep 5

      - name: Run Module Tests
        run: |
          docker run --rm --network fitai-network --env-file .env fitai-app:test sh -c ' \
            if [ ! -d "./internal/${{ matrix.module }}" ] || ! find ./internal/${{ matrix.module }} -name "*.go" 2>/dev/null | grep -q .; then \
              echo "⚠️ Module \"${{ matrix.module }}\" chưa triển khai Go code hoặc không có test. Bỏ qua kiểm thử."; \
              exit 0; \
            fi; \
            OUT=$(go test -v -race -p=1 -tags="unit,integration,e2e" ./internal/${{ matrix.module }}/... 2>&1); \
            STATUS=$?; \
            echo "$OUT"; \
            PASSED=$(echo "$OUT" | grep -c -e "--- PASS:"); \
            FAILED=$(echo "$OUT" | grep -c -e "--- FAIL:"); \
            echo "=================================================="; \
            echo "📊 TỔNG HỢP KẾT QUẢ KIỂM THỬ MODULE ${{ matrix.module }}:"; \
            echo "🟢 ĐẠT (PASSED): $PASSED"; \
            echo "🔴 THẤT BẠI (FAILED): $FAILED"; \
            echo "=================================================="; \
            if [ $STATUS -ne 0 ] || [ $FAILED -gt 0 ]; then exit 1; fi'

  build-production-image:
    name: Build & Push Production Image
    needs: [detect-changes, run-module-tests]
    if: ${{ needs.detect-changes.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf Stubs
        run: make proto-gen

      - name: Build & Push Production Image to GHCR
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          docker build --target prod -t $IMAGE_ID:latest -t $IMAGE_ID:${{ github.sha }} .
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}
