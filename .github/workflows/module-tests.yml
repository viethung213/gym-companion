name: Module Selective Tests & GHCR Publish CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      modules: ${{ steps.set-modules.outputs.modules }}
      has_modules: ${{ steps.set-modules.outputs.has_modules }}
      build_core: ${{ steps.set-modules.outputs.build_core }}
      build_ai: ${{ steps.set-modules.outputs.build_ai }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            global:
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'Makefile'
              - 'proto/buf.*'
              - 'proto/buf.gen.yaml'
              - 'internal/gen/**'
              - '.github/workflows/module-tests.yml'
            core_extra:
              - 'cmd/core/**'
              - 'migrations/core/**'
            ai_extra:
              - 'cmd/ai/**'
              - 'migrations/ai/**'
            audio:
              - 'internal/audio/**'
              - 'proto/contracts/generic/audio/**'
            auth:
              - 'internal/auth/**'
              - 'proto/contracts/generic/auth/**'
            coaching:
              - 'internal/coaching/**'
              - 'proto/contracts/core/coaching/**'
            exercise:
              - 'internal/exercise/**'
              - 'proto/contracts/supporting/exercise/**'
            gamification:
              - 'internal/gamification/**'
              - 'proto/contracts/core/gamification/**'
            notification:
              - 'internal/notification/**'
              - 'proto/contracts/generic/notification/**'
            nutrition:
              - 'internal/nutrition/**'
              - 'proto/contracts/core/nutrition/**'
            profile:
              - 'internal/profile/**'
              - 'proto/contracts/supporting/profile/**'
            shared:
              - 'internal/shared/**'
            social:
              - 'internal/social/**'
              - 'proto/contracts/supporting/social/**'
            solo_match:
              - 'internal/solo_match/**'
              - 'proto/contracts/core/solo_match/**'
            workout_execution:
              - 'internal/workout_execution/**'
              - 'proto/contracts/core/workout_execution/**'

      - name: Compute Target Modules Matrix
        id: set-modules
        run: |
          ALL_MODULES='["audio","auth","coaching","exercise","gamification","notification","nutrition","profile","shared","social","solo_match","workout_execution"]'
          
          BUILD_CORE=false
          BUILD_AI=false

          if [ "${{ steps.filter.outputs.global }}" == "true" ]; then
            echo "Global or core shared files changed. Running tests for ALL modules."
            echo "modules=${ALL_MODULES}" >> $GITHUB_OUTPUT
            echo "has_modules=true" >> $GITHUB_OUTPUT
            BUILD_CORE=true
            BUILD_AI=true
          else
            SELECTED=()
            [ "${{ steps.filter.outputs.audio }}" == "true" ] && SELECTED+=('"audio"')
            [ "${{ steps.filter.outputs.auth }}" == "true" ] && SELECTED+=('"auth"')
            [ "${{ steps.filter.outputs.coaching }}" == "true" ] && SELECTED+=('"coaching"')
            [ "${{ steps.filter.outputs.exercise }}" == "true" ] && SELECTED+=('"exercise"')
            [ "${{ steps.filter.outputs.gamification }}" == "true" ] && SELECTED+=('"gamification"')
            [ "${{ steps.filter.outputs.notification }}" == "true" ] && SELECTED+=('"notification"')
            [ "${{ steps.filter.outputs.nutrition }}" == "true" ] && SELECTED+=('"nutrition"')
            [ "${{ steps.filter.outputs.profile }}" == "true" ] && SELECTED+=('"profile"')
            [ "${{ steps.filter.outputs.shared }}" == "true" ] && SELECTED+=('"shared"')
            [ "${{ steps.filter.outputs.social }}" == "true" ] && SELECTED+=('"social"')
            [ "${{ steps.filter.outputs.solo_match }}" == "true" ] && SELECTED+=('"solo_match"')
            [ "${{ steps.filter.outputs.workout_execution }}" == "true" ] && SELECTED+=('"workout_execution"')

            if [ "${{ steps.filter.outputs.shared }}" == "true" ]; then
              BUILD_CORE=true
              BUILD_AI=true
            fi

            if [ "${{ steps.filter.outputs.core_extra }}" == "true" ] || \
               [ "${{ steps.filter.outputs.audio }}" == "true" ] || \
               [ "${{ steps.filter.outputs.auth }}" == "true" ] || \
               [ "${{ steps.filter.outputs.exercise }}" == "true" ] || \
               [ "${{ steps.filter.outputs.gamification }}" == "true" ] || \
               [ "${{ steps.filter.outputs.profile }}" == "true" ] || \
               [ "${{ steps.filter.outputs.social }}" == "true" ] || \
               [ "${{ steps.filter.outputs.solo_match }}" == "true" ] || \
               [ "${{ steps.filter.outputs.workout_execution }}" == "true" ]; then
              BUILD_CORE=true
            fi

            if [ "${{ steps.filter.outputs.ai_extra }}" == "true" ] || \
               [ "${{ steps.filter.outputs.coaching }}" == "true" ] || \
               [ "${{ steps.filter.outputs.notification }}" == "true" ] || \
               [ "${{ steps.filter.outputs.nutrition }}" == "true" ]; then
              BUILD_AI=true
            fi

            if [ ${#SELECTED[@]} -eq 0 ]; then
              echo "No module code changes detected. Skipping module tests."
              echo "modules=[]" >> $GITHUB_OUTPUT
              echo "has_modules=false" >> $GITHUB_OUTPUT
            else
              JSON_ARRAY=$(IFS=,; echo "[${SELECTED[*]}]")
              echo "Selected modules to test: ${JSON_ARRAY}"
              echo "modules=${JSON_ARRAY}" >> $GITHUB_OUTPUT
              echo "has_modules=true" >> $GITHUB_OUTPUT
            fi
          fi

          echo "build_core=${BUILD_CORE}" >> $GITHUB_OUTPUT
          echo "build_ai=${BUILD_AI}" >> $GITHUB_OUTPUT

  build-test-image:
    name: Build Base Test Image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf Stubs
        run: make proto-gen

      - name: Build Base Test Image
        run: |
          make build-test
          docker save fitai-app:test -o test-image.tar

      - name: Upload Test Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: test-image.tar
          retention-days: 1

  run-module-tests:
    name: Test Module (${{ matrix.module }})
    needs: [detect-changes, build-test-image]
    if: ${{ needs.detect-changes.outputs.has_modules == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Test Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-image

      - name: Load Test Image
        run: docker load -i test-image.tar

      - name: Start Test Infrastructure (Postgres, Kafka & Redis)
        run: |
          make test-env-up
          sleep 5

      - name: Run Module Tests
        run: |
          docker run --rm --network fitai-network --env-file .env fitai-app:test sh -c ' \
            if [ ! -d "./internal/${{ matrix.module }}" ] || ! find ./internal/${{ matrix.module }} -name "*.go" 2>/dev/null | grep -q .; then \
              echo "⚠️ Module \"${{ matrix.module }}\" chưa triển khai Go code hoặc không có test. Bỏ qua kiểm thử."; \
              exit 0; \
            fi; \
            OUT=$(go test -v -race -p=1 -tags="unit,integration,e2e" ./internal/${{ matrix.module }}/... 2>&1); \
            STATUS=$?; \
            echo "$OUT"; \
            PASSED=$(echo "$OUT" | grep -c -e "--- PASS:"); \
            FAILED=$(echo "$OUT" | grep -c -e "--- FAIL:"); \
            echo "=================================================="; \
            echo "📊 TỔNG HỢP KẾT QUẢ KIỂM THỬ MODULE ${{ matrix.module }}:"; \
            echo "🟢 ĐẠT (PASSED): $PASSED"; \
            echo "🔴 THẤT BẠI (FAILED): $FAILED"; \
            echo "=================================================="; \
            if [ $STATUS -ne 0 ] || [ $FAILED -gt 0 ]; then exit 1; fi'

  publish-core-image:
    name: Build & Push Core Image to GHCR
    needs: [detect-changes, run-module-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.build_core == 'true' &&
      (needs.run-module-tests.result == 'success' || needs.detect-changes.outputs.has_modules == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf Stubs
        run: make proto-gen

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Image Tags
        id: prep
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=ghcr.io/${REPO_OWNER}/fitai-core:latest" >> $GITHUB_OUTPUT
          echo "sha_tag=ghcr.io/${REPO_OWNER}/fitai-core:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Core Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod-core
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-ai-image:
    name: Build & Push AI Image to GHCR
    needs: [detect-changes, run-module-tests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.build_ai == 'true' &&
      (needs.run-module-tests.result == 'success' || needs.detect-changes.outputs.has_modules == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Protobuf Stubs
        run: make proto-gen

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Image Tags
        id: prep
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=ghcr.io/${REPO_OWNER}/fitai-ai:latest" >> $GITHUB_OUTPUT
          echo "sha_tag=ghcr.io/${REPO_OWNER}/fitai-ai:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push AI Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod-ai
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
