services:
  postgres:
    image: postgres:16-alpine
    container_name: fitai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitai
    ports:
      - "5432:5432"
    volumes:
      - fitai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: fitai-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Local trace viewer. Each LLM call shows up as a `generate_content` span;
  # read gen_ai.usage.input_tokens on it to see how large the prompt really is.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: fitai-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI
      - "4318:4318" # OTLP/HTTP receiver

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: fitai-app
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_PORT: "8080"
      GRPC_PORT: "9090"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fitai?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      OAUTH_STATE_SECRET: local-dev-state-secret-change-in-prod
      JWT_ISSUER: fitai-local
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Unset by default: tracing is opt-in, so nothing changes unless asked for.
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - default

volumes:
  fitai-postgres-data:
