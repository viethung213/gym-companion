version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: fitai-app-test
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    env_file:
      - .env
    environment:
      # Cloud Storage / Supabase S3 — override with real values via .env or CI secrets
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-gym-companion-assets}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DEFAULT_ONNX_DETECTOR_URL: ${DEFAULT_ONNX_DETECTOR_URL:-}
      DEFAULT_ONNX_SKELETON_URL: ${DEFAULT_ONNX_SKELETON_URL:-}
    networks:
      - fitai-network

networks:
  fitai-network:
    name: fitai-network
    external: true
